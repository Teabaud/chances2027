name: daily forecast

on:
  schedule:
    - cron: "30 5 * * *" # 07:30 Paris (summer) — after overnight poll releases
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Legal blackout guard
        id: guard
        run: uv run --frozen pipeline/blackout.py | tee -a "$GITHUB_OUTPUT"
      - name: Fetch polls and run model
        if: steps.guard.outputs.frozen != 'true'
        run: |
          uv run --frozen pipeline/fetch.py
          uv run --frozen pipeline/model.py
          uv run --frozen pipeline/model.py --backfill
          node tests/vote-logic.test.mjs
          uv run --frozen python tests/test_model.py
      - name: Archive today's build in git (legal record of what was published)
        if: steps.guard.outputs.frozen != 'true'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/polls.csv site/data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.guard.outputs.frozen != 'true'
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.guard.outputs.frozen != 'true'
